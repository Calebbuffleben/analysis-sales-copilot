syntax = "proto3";

package feedback_ingestion;

service FeedbackIngestionService {
  rpc PublishFeedback(PublishFeedbackRequest) returns (PublishFeedbackResponse);
  rpc ReportSessionLifecycle(SessionLifecycleRequest) returns (SessionLifecycleResponse);
  rpc PublishMeetingSnapshot(MeetingSnapshotRequest) returns (MeetingSnapshotResponse);
}

message AnalysisPayload {
  string direct_feedback = 1;
  string conversation_state_json = 2;
  int32 samples_count = 3;
  int32 speech_count = 4;
  float mean_rms_dbfs = 5;
  // JSON: { "playbook_template_key", "playbook_variables", ... } per backend contract
  string playbook_hint_json = 6;
}

message PublishFeedbackRequest {
  string meeting_id = 1;
  string participant_id = 2;
  string participant_name = 3;
  string participant_role = 4;
  string feedback_type = 5;
  string severity = 6;
  int64 ts_ms = 7;
  int64 window_start_ms = 8;
  int64 window_end_ms = 9;
  string message = 10;
  string transcript_text = 11;
  float transcript_confidence = 12;
  AnalysisPayload analysis = 13;
  // Redundant tenant hint. MUST match x-tenant-id metadata; for SERVICE
  // tokens, x-tenant-id is the effective tenant and is validated as ACTIVE.
  string tenant_id = 14;
}

message PublishFeedbackResponse {
  bool accepted = 1;
  string feedback_id = 2;
  string message = 3;
}

message SessionLifecycleRequest {
  string tenant_id = 1;
  string meeting_id = 2;
  string user_id = 3;
  string participant_id = 4;
  string participant_role = 5;
  string track = 6;
  int32 sample_rate = 7;
  int32 channels = 8;
  string event = 9;
  int64 duration_ms = 10;
  int32 chunks_received = 11;
}

message SessionLifecycleResponse {
  bool accepted = 1;
}

message MeetingSnapshotRequest {
  string tenant_id = 1;
  string meeting_id = 2;
  int32 health_score = 3;
  string talk_listen_json = 4;
  string objections_json = 5;
  string playbook_adherence_json = 6;
  string sentiment_trend_json = 7;
  string alerts_json = 8;
  int64 ts_ms = 9;
}

message MeetingSnapshotResponse {
  bool accepted = 1;
}
